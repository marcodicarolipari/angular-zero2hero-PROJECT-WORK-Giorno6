<div class="profile-container">
  @if (loading) {
    <div class="loading">
      <p>Caricamento profilo...</p>
    </div>
  }
  @if (user && !loading) {
    <div class="profile-card">
      <div class="profile-header">
        <img [src]="user.avatar" [alt]="user.name" class="avatar">
        <div class="user-info">
          <h1>{{ user.name }}</h1>
          <p class="role">{{ user.role | uppercase }}</p>
        </div>
      </div>

      <div class="profile-details">
        <div class="detail-item">
          <label>Email:</label>
          <p>{{ user.email }}</p>
        </div>

        @if (user.phone) {
          <div class="detail-item">
            <label>Telefono:</label>
            <p>{{ user.phone }}</p>
          </div>
        }

        @if (user.joinDate) {
          <div class="detail-item">
            <label>Membro da:</label>
            <p>{{ user.joinDate | date: 'dd/MM/yyyy' }}</p>
          </div>
        }

        <div class="detail-item">
          <label>ID Utente:</label>
          <p>{{ user.id }}</p>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary">Modifica Profilo</button>
        <button class="btn btn-secondary">Esci</button>
      </div>
    </div>
  }
</div>
